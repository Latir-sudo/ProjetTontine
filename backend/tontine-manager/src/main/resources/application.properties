# Configuration Orange Money
# Définissez ces variables d'environnement avant de lancer le backend :
# ORANGE_MONEY_BASE_URL=https://api.orange.com
# ORANGE_MONEY_API_KEY=votre-cle-api
# ORANGE_MONEY_CLIENT_ID=votre-client-id
# ORANGE_MONEY_CLIENT_SECRET=votre-client-secret
# ORANGE_MONEY_PAYMENT_PATH=/orange-money/payments
orange.money.base-url=${ORANGE_MONEY_BASE_URL:https://api.orange.com}
orange.money.api-key=${ORANGE_MONEY_API_KEY:}
orange.money.client-id=${ORANGE_MONEY_CLIENT_ID:}
orange.money.client-secret=${ORANGE_MONEY_CLIENT_SECRET:}
orange.money.payment-path=${ORANGE_MONEY_PAYMENT_PATH:/orange-money/payments}

# Wave Checkout API. Les secrets doivent rester dans les variables d'environnement.
# Les URL de retour et du webhook doivent être publiques et en HTTPS en production.
wave.api.base-url=${WAVE_API_BASE_URL:https://api.wave.com}
wave.api.key=${WAVE_API_KEY:}
wave.api.signing-secret=${WAVE_API_SIGNING_SECRET:}
wave.webhook.secret=${WAVE_WEBHOOK_SECRET:}
wave.checkout.success-url=${WAVE_SUCCESS_URL:}
wave.checkout.error-url=${WAVE_ERROR_URL:}

