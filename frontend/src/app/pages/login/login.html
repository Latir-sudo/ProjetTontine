<div class="page-shell login-shell">
  <section class="auth-card">
    <div class="auth-header">
      <span class="brand-pill">Connexion</span>
      <h1>Tontine Manager</h1>
      <p>Connectez-vous pour continuer</p>
    </div>

    <form class="auth-form" (ngSubmit)="login()">
      <label>
        <span>Email</span>
        <input
          type="email"
          placeholder="exemple@email.com"
          [(ngModel)]="credentials.email"
          name="email"
          required
          autocomplete="email"
        />
      </label>

      <label>
        <span>Mot de passe</span>
        <input
          type="password"
          placeholder="Votre mot de passe"
          [(ngModel)]="credentials.password"
          name="password"
          required
          autocomplete="current-password"
        />
      </label>

      <div *ngIf="errorMessage" class="error-message">
        <i class="ri-error-warning-line"></i> {{ errorMessage }}
      </div>

      <div *ngIf="isLoading" class="loading-spinner">
        <div class="spinner-dot"></div>
        Connexion en cours...
      </div>

      <div class="auth-action-row">
        <a routerLink="/forgot-password">Mot de passe oublié ?</a>
      </div>

      <button class="primary-button" type="submit" [disabled]="isLoading">
        <i class="ri-login-circle-line"></i>
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="auth-footer">
      Pas encore de compte ? <a routerLink="/inscription">S'inscrire gratuitement</a>
    </p>
  </section>
</div>
